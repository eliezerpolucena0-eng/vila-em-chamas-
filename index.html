<body>
<h1>VILA EM CHAMAS</h1>
<div class="wrap"><div class="stage"><canvas id="c" width="320" height="180"></canvas><div id="fps">-- FPS</div><div id="shop"></div><div class="top"><button id="bm">☰</button><button id="be" title="Entrar na casa">🚪</button><button id="bp" title="Tomar poção de cura">🧪</button><button id="bi">🎒</button><button id="bt">📊</button><button id="bf">⛶</button><button id="bz" title="Inverter lados">↔</button><button id="bu">🔊</button></div></div>
<div id="ced"><span id="cedn">PULAR</span><input type="range" id="cedz" min="50" max="220" step="5" value="100"><button id="cedr">↺ Padrão</button><button id="cedc">✖ Cancelar</button><button id="ceds">✔ Salvar</button></div>
<div class="pad">
  <div class="pg"><button id="bl">◀</button><button id="br">▶</button></div>
  <div class="pg"><button id="bs">🔄</button><button id="bk">✨</button><button id="ba">⚔</button><button id="bd">💨</button><button id="bj">⬆</button></div>
</div></div>
<small>← → / A D andar · Espaço/W pula (2x) · J ataca · K especial · Q troca arma · I inventário · 1-4 poções · C status · Esc menu · R reinicia</small>
<div id="menu"><canvas id="mbg" width="320" height="180"></canvas><div id="mbox"></div></div>
<script>
window.addEventListener('error',function(e){try{var d=document.getElementById('dbgerr');if(!d){d=document.createElement('pre');d.id='dbgerr';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;margin:0;padding:8px;background:#900;color:#fff;font:11px monospace;white-space:pre-wrap;max-height:50vh;overflow:auto';document.body.appendChild(d);}d.textContent+=(e.message||'erro')+' @linha '+e.lineno+':'+e.colno+'\n';}catch(_){}});
</script>
<script>
'use strict';
// ===== Base: canvas em 320x180 (pixel art real, ampliado pelo CSS) =====
const cv=document.getElementById('c'), g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
const W=320,H=180,GY=156,DY=16,R=Math.round,MX=Math.max,MN=Math.min,TAU=Math.PI*2;
let T=0;
// ===== Configurações (gráficos, controles) =====
const DKB={l:'ArrowLeft',r:'ArrowRight',j:'Space',a:'KeyJ',k:'KeyK',s:'KeyQ'};
const ALT={KeyA:'l',KeyD:'r',ArrowUp:'j',KeyW:'j',KeyZ:'a',KeyE:'a',KeyX:'k'};
const RES=['Escape','KeyC','KeyI','KeyR','Digit1','Digit2','Digit3','Digit4','Tab','Enter'];
let CFG={gfx:1,bsm:1,bop:.7,vib:true,kb:Object.assign({},DKB)};
function vib(n){ if(CFG.vib&&navigator.vibrate) try{navigator.vibrate(n);}catch(_){} }
try{ const s=JSON.parse(localStorage.getItem('vc_cfg')||'null');
  if(s&&typeof s==='object'){
    if(s.gfx===0||s.gfx===1||s.gfx===2) CFG.gfx=s.gfx;
    if(s.bsm>=.7&&s.bsm<=1.4) CFG.bsm=s.bsm;
    if(s.bop>=.3&&s.bop<=1) CFG.bop=s.bop;
    if(typeof s.vib==='boolean') CFG.vib=s.vib;
    if(s.kb&&typeof s.kb==='object') for(const a in DKB) if(typeof s.kb[a]==='string'&&/^[A-Za-z0-9]{1,20}$/.test(s.kb[a])&&!RES.includes(s.kb[a])) CFG.kb[a]=s.kb[a];
  } }catch(_){}
let GFX=CFG.gfx;
function actOf(c){ for(const a in CFG.kb) if(CFG.kb[a]===c) return a; return ALT[c]||null; }
function applyCfg(){ GFX=CFG.gfx; const h=document.documentElement; h.classList.toggle('gl',GFX===0); h.style.setProperty('--bsm',CFG.bsm); h.style.setProperty('--bop',CFG.bop); }
const clamp=(v,a,b)=>MX(a,MN(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function rect(x,y,w,h,c){ g.fillStyle=c; g.fillRect(R(x),R(y),w,h); }
function shade(hex,a){
  const n=parseInt(hex.slice(1),16), f=v=>clamp(R(a<0?v*(1+a):v+(255-v)*a),0,255);
  return '#'+((1<<24)|(f(n>>16)<<16)|(f((n>>8)&255)<<8)|f(n&255)).toString(16).slice(1);
}
// elipse e triangulo em pixels (linhas de varredura)
function ell(cx,cy,rx,ry,c){
  for(let j=-ry;j<=ry;j++){ const w=R(rx*Math.sqrt(1-(j*j)/(ry*ry+.01))); rect(cx-w,cy+j,w*2+1,1,c); }
}
function tri(x1,y1,x2,y2,x3,y3,c){
  const ys=[y1,y2,y3], top=MN(...ys), bot=MX(...ys);
  for(let y=R(top);y<=bot;y++){
    const xs=[]; const E=[[x1,y1,x2,y2],[x2,y2,x3,y3],[x3,y3,x1,y1]];

  if(!u){ return /^https?:$/.test(location.protocol)?((location.protocol==='https:'?'wss://':'ws://')+location.host):''; }

  const setDir=d=>{ const cur=(keys.r?1:0)-(keys.l?1:0); if(d===cur) return; if(d&&!cur) tapDir(d); keys.l=d<0; keys.r=d>0; bl.classList.toggle('on',d<0); br.classList.toggle('on',d>0); if(d) vib(5); };
  const hit=e=>{ const t=document.elementFromPoint(e.clientX,e.clientY); if(t&&(t===bl||bl.contains(t))) setDir(-1); else if(t&&(t===br||br.contains(t))) setDir(1); };
  [bl,br].forEach(el=>{
    el.addEventListener('pointerdown',e=>{ if(pid!==null) return; e.preventDefault(); pid=e.pointerId; try{el.setPointerCapture(pid);}catch(_){} hit(e); });
    el.addEventListener('pointermove',e=>{ if(e.pointerId===pid) hit(e); });
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,e=>{ if(e.pointerId===pid){ pid=null; setDir(0); } }));
  });
})();

let tapD=0,tapT=0;
function doDash(d){
  if(scene==='room'&&!lost&&!won){ if(P.dsc>0||roomD>0) return; roomD=9; roomDD=d; P.dsc=300; rdir=d; sfx('swing'); return; }
  if(scene!=='play'||lost||won||endT>0||P.hide||P.gone||P.dsc>0||P.dsh>0) return;
  P.dsh=9; P.dd=d; P.dsc=300; P.dir=d; P.inv=MX(P.inv,P.dinv||12); prog('dash');
  dust(P.x+4,P.y+P.h,5); sfx('swing');
}
function tapDir(d){
  const n=performance.now();
  if(tapD===d&&n-tapT<260){ tapD=0; doDash(d); } else { tapD=d; tapT=n; }
}
function k(e,v){
  const c=e.code; let hit=true;
  if(scene==='free'){ const a0=actOf(c);
    if(a0==='a'){ keys.a=v; e.preventDefault(); return; }
    if(v&&c==='KeyC'){ e.preventDefault(); return; }
    if(v&&c==='KeyI'){ document.getElementById('bi').click(); e.preventDefault(); return; }
    if(v&&/^Digit[1-8]$/.test(c)){ if(FW) FW.sel=+c.slice(5)-1; e.preventDefault(); return; } }
  const ac=actOf(c);
  if(ac==='l'){ if(v&&!e.repeat&&!keys.l) tapDir(-1); keys.l=v; }
  else if(ac==='r'){ if(v&&!e.repeat&&!keys.r) tapDir(1); keys.r=v; }
  else if(ac==='j') keys.j=v;
  else if(v&&ac==='a') act();
  else if(v&&ac==='k') special();
  else if(v&&ac==='s') swap();
  else if(v&&/^Digit[1-4]$/.test(c)) usePot(+c.slice(5)-1);
  else if(v&&c==='KeyC') toggleStats();
  else if(v&&c==='Escape') document.getElementById('bm').click();
  else if(v&&c==='KeyI') toggleInv();
  else if(v&&c==='KeyR') reset();
  else hit=false;
  if(hit) e.preventDefault();
}

let gpPrev={},gpOff=false;
function pollPad(){
  let gps=[]; if(gpOff) return; try{ gps=navigator.getGamepads?navigator.getGamepads():[]; }catch(_){ gpOff=true; return; } const gp=[...gps].find(x=>x&&x.connected); if(!gp) return;
  const ax=gp.axes[0]||0, b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
  const st={l:ax<-.4||b(14),r:ax>.4||b(15),j:b(0)||b(12),a:b(2)||b(1),k:b(3),s:b(4)||b(5)};
  if(st.l!==gpPrev.l){ keys.l=st.l; if(st.l) tapDir(-1); } if(st.r!==gpPrev.r){ keys.r=st.r; if(st.r) tapDir(1); } if(st.j!==gpPrev.j) keys.j=st.j;
  if(st.a&&!gpPrev.a) act(); if(st.a!==gpPrev.a) keys.a=st.a;
  if(st.k&&!gpPrev.k) special(); if(st.s&&!gpPrev.s) swap();
  gpPrev=st;
}

// ----- Layout personalizado dos botões de toque -----
const PADIDS=['bl','br','bs','bk','ba','bd','bj'], PADBASE={bl:1.2,br:1.2,bs:.8,bk:1,ba:1,bd:.9,bj:1.25};
const PADDEF={bl:{x:.09,y:.80,s:1},br:{x:.22,y:.80,s:1},bs:{x:.93,y:.50,s:1},bk:{x:.79,y:.60,s:1},ba:{x:.77,y:.82,s:1},bj:{x:.91,y:.80,s:1}};
const PADNM={bl:'ESQUERDA',br:'DIREITA',bs:'TROCAR ARMA',bk:'ESPECIAL',ba:'ATAQUE',bj:'PULAR'};
let PADC=null,EDIT=null,ESEL='bj',pdrag=null;
try{ const q0=JSON.parse(localStorage.getItem('vc_pad')||'null'); if(q0&&typeof q0==='object'){ PADC={}; for(const id of PADIDS){ const q=q0[id]; PADC[id]=(q&&q.x>=0&&q.x<=1&&q.y>=0&&q.y<=1&&q.s>=.4&&q.s<=2.5)?{x:q.x,y:q.y,s:q.s}:Object.assign({},PADDEF[id]); } } }catch(_){ PADC=null; }
function applyPad(src){
  const c=src||PADC, lf=HT.classList.contains('lefty'); HT.classList.toggle('cl',!!c);
  for(const id of PADIDS){ const b=document.getElementById(id), q=c?c[id]:null;
    if(!q){ b.style.removeProperty('--px'); b.style.removeProperty('--py'); b.style.removeProperty('--bk'); b.classList.remove('sel'); continue; }
    b.style.setProperty('--px',String(lf?1-q.x:q.x)); b.style.setProperty('--py',String(q.y)); b.style.setProperty('--bk',String(PADBASE[id]*q.s)); b.classList.toggle('sel',!!src&&id===ESEL); }
}
function syncCed(){ document.getElementById('cedn').textContent=PADNM[ESEL]; document.getElementById('cedz').value=Math.round(EDIT[ESEL].s*100); applyPad(EDIT); }
function startPadEdit(){
  if(!HT.classList.contains('ls')){ showCfg('Ative "Girar tela" ou deite o celular para editar os botões.'); return; }
  EDIT=JSON.parse(JSON.stringify(PADC||PADDEF)); ESEL='bj'; menuEl.style.display='none'; HT.classList.add('edit'); syncCed();
}
function endPadEdit(msg){ HT.classList.remove('edit'); EDIT=null; pdrag=null; applyPad(); menuEl.style.display='flex'; showCfg(msg); }
(function(){
  const padEl=document.querySelector('.pad');
  const frac=e=>{ const r=padEl.getBoundingClientRect(); let u,v; if(HT.classList.contains('turn')){ u=(e.clientY-r.top)/r.height; v=(r.right-e.clientX)/r.width; } else { u=(e.clientX-r.left)/r.width; v=(e.clientY-r.top)/r.height; } return {u:clamp(u,.03,.97),v:clamp(v,.06,.94)}; };
  const mv=e=>{ const f=frac(e), lf=HT.classList.contains('lefty'); EDIT[pdrag.id].x=lf?1-f.u:f.u; EDIT[pdrag.id].y=f.v; applyPad(EDIT); };
  padEl.addEventListener('pointerdown',e=>{ if(!HT.classList.contains('edit')) return; const b=e.target.closest&&e.target.closest('button'); if(!b||!PADIDS.includes(b.id)) return; e.preventDefault(); e.stopPropagation(); ESEL=b.id; pdrag={id:b.id,pid:e.pointerId}; try{ b.setPointerCapture(e.pointerId); }catch(_){} mv(e); syncCed(); },true);
  addEventListener('pointermove',e=>{ if(pdrag&&e.pointerId===pdrag.pid) mv(e); });
  ['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,e=>{ if(pdrag&&e.pointerId===pdrag.pid) pdrag=null; }));
  document.getElementById('cedz').oninput=e=>{ if(!EDIT) return; EDIT[ESEL].s=+e.target.value/100; applyPad(EDIT); };
  document.getElementById('cedr').onclick=()=>{ if(!EDIT) return; EDIT=JSON.parse(JSON.stringify(PADDEF)); syncCed(); };
  document.getElementById('cedc').onclick=()=>endPadEdit();
  document.getElementById('ceds').onclick=()=>{ if(!EDIT) return; PADC=JSON.parse(JSON.stringify(EDIT)); try{ localStorage.setItem('vc_pad',JSON.stringify(PADC)); }catch(_){} endPadEdit('✔ Layout dos botões salvo!'); };
})();
